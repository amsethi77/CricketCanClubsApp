<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <script src="/assets/zoom_lock.js?v=20261014a"></script>
    <title>Sign In · CricketClubApp</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/assets/tailwind.css?v=20260430b" />
    <link rel="stylesheet" href="/assets/styles.css?v=20261016g" />
    <link rel="stylesheet" href="/assets/live.css?v=20261016b" />
    <link rel="stylesheet" href="/assets/signin.css?v=20261016a" />
    <link rel="stylesheet" href="/assets/sports-system.css?v=20260926a" />
  </head>
  <body class="public-auth-page signin-v2">
    <div data-public-header></div>
    <div class="page-shell">
      <div class="signin-page-grid signin-simple">
        <section class="signin-layout">
          <div class="panel onboarding-panel signin-form-panel">
            <div class="stack-card">
              <div class="si-brand" aria-hidden="true">CC</div>
                            <h1 class="signin-title">Sign in</h1>
              <p class="lede">Use the mobile number or email your club has for you.</p>
              <div id="signinStatus" class="status-banner" hidden></div>
              <form id="signinForm" class="form-grid si-form" method="post" action="/signin/quick">
                <label class="si-field" for="signinIdentifier">
                  <span class="si-label">Mobile or email</span>
                  <span class="si-input">
                    <span class="si-icon" aria-hidden="true">
                      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
                    </span>
                    <input id="signinIdentifier" name="identifier" type="text" placeholder="e.g. 4165550123 or you@email.com" autocomplete="username" required />
                  </span>
                </label>
                <label class="si-field" for="signinPassword">
                  <span class="si-label">Password</span>
                  <span class="si-input">
                    <span class="si-icon" aria-hidden="true">
                      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
                    </span>
                    <input id="signinPassword" name="password" type="password" placeholder="No password? Leave empty" autocomplete="current-password" />
                    <button type="button" class="si-toggle" id="signinPasswordToggle" aria-label="Show password" aria-pressed="false">Show</button>
                  </span>
                </label>
                  <label class="si-field" for="signinPlayerName" id="signinQuick" hidden>
                    <span class="si-label">Player name <small></small></span>
                    <span class="si-input">
                      <span class="si-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l4-1 10-10-3-3L5 16z"/><path d="M14 7l3 3"/></svg>
                      </span>
                      <input id="signinPlayerName" name="player_name" type="text" placeholder="Name as saved by your club" autocomplete="name" />
                    </span>
                    <span class="si-hint">We couldn't find you by mobile or email alone. Add your name as your club saved it.</span>
                  </label>
                <button class="primary-button wide si-submit" type="submit">Sign in</button>
              </form>
              <div class="si-divider"><span>New to CricketCanClubs?</span></div>
              <a class="primary-link auth-cta-link secondary wide si-register" href="/register">Create an account</a>
            </div>
          </div>
        </section>
      </div>
    </div>
    <script>
      (function () {
        var input = document.getElementById("signinPassword");
        var toggle = document.getElementById("signinPasswordToggle");
        var player = document.getElementById("signinPlayerName");
        if (toggle && input) {
          toggle.addEventListener("click", function () {
            var show = input.type === "password";
            input.type = show ? "text" : "password";
            toggle.textContent = show ? "Hide" : "Show";
            toggle.setAttribute("aria-pressed", show ? "true" : "false");
            toggle.setAttribute("aria-label", show ? "Hide password" : "Show password");
          });
        }
        // Show the player name box if the browser filled one in.
        setTimeout(function () { if (player && player.value) document.getElementById("signinQuick").hidden = false; }, 300);
      })();
    </script>
    <script src="/assets/public_header.js?v=20261016f"></script>
    <script src="/assets/multipage.js?v=20261016e"></script>
    <script src="/assets/signin.js?v=20261016a"></script>
  </body>
</html>
