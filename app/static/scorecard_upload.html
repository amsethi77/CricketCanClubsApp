<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <script src="/assets/zoom_lock.js?v=20261123a"></script>
    <title>Upload a scorecard · CricketClubApp</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/assets/tailwind.css" />
    <link rel="stylesheet" href="/assets/styles.css?v=20261111tablealign" />
    <link rel="stylesheet" href="/assets/live.css?v=20261030m" />
    <link rel="stylesheet" href="/assets/scorecards.css?v=20261117s" />
    <link rel="stylesheet" href="/assets/sports-system.css?v=20261030m" />
    <link rel="stylesheet" href="/assets/report_type.css?v=20261127a" />
  </head>
  <body class="public-fixtures-page scorecards-page scorecard-upload-page">
    <!-- Captains and club admins upload a scorecard photo. README: "Scorecard uploads: checks, review and duplicates". -->
    <main class="page-shell fixtures-shell">
      <div data-public-header></div>
      <a class="sc-back" href="/scorecards">&lsaquo; All scorecards</a>
      <section class="panel onboarding-panel fixtures-hero-panel">
        <div class="stack-card">
          <p class="section-kicker">Scorecards</p>
          <h1 class="fixtures-title">Upload a scorecard</h1>
          <p class="lede">Take a clear photo of the paper scorecard, or upload it in any format (JPG, PNG, HEIC, PDF, TIFF ...). A PDF with two pages gives both innings. We read it, check it for mistakes and duplicates, and show you the digital scorecard before it goes live.</p>
        </div>
      </section>
      <section class="panel onboarding-panel fixtures-list-panel">
        <div class="stack-card">
          <div id="scuGate" class="live-empty" hidden></div>
          <form id="scuForm" class="scu-form" hidden>
            <label>Club
              <select id="scuClub"></select>
            </label>
            <label class="scu-drop" for="scuFile">
              <span id="scuDropText">📷 1st innings photo or PDF <small>(the team that batted first - tap to take or choose)</small></span>
              <img id="scuPreview" alt="" hidden />
              <input id="scuFile" type="file" accept="image/*,application/pdf,.pdf,.jpg,.jpeg,.png,.webp,.heic,.heif,.tif,.tiff,.bmp,.gif" />
            </label>
            <label class="scu-drop scu-drop-second" for="scuFile2">
              <span id="scuDropText2">📷 2nd innings photo or PDF <small>(the team that batted second - add one or both)</small></span>
              <img id="scuPreview2" alt="" hidden />
              <input id="scuFile2" type="file" accept="image/*,application/pdf,.pdf,.jpg,.jpeg,.png,.webp,.heic,.heif,.tif,.tiff,.bmp,.gif" />
            </label>
            <label>Other team's Match ID <small>(optional - if they already uploaded the other innings)</small>
              <input id="scuLink" type="text" placeholder="e.g. M-8A311D9B" autocomplete="off" />
            </label>
            <label id="scuLeagueLabel" hidden>League / series <small>(optional - pick it if this match is part of a league)</small>
              <select id="scuLeague"><option value="">Not a league match</option></select>
            </label>
            <label>Season <small>(optional)</small>
              <input id="scuSeason" type="text" placeholder="e.g. 2026 Season" autocomplete="off" />
            </label>
            <button class="sc-btn primary" type="submit">Upload and check</button>
            <p id="scuMsg" class="scu-msg" role="status"></p>
          </form>
        </div>
      </section>
    </main>
    <script src="/assets/public_header.js?v=20261127a"></script>
    <script src="/assets/scorecard_upload.js?v=20261118c"></script>
  </body>
</html>
