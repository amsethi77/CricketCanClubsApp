<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <script src="/assets/zoom_lock.js?v=20261030f"></script>
    <title>Scorecard · CricketClubApp</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/assets/tailwind.css" />
    <link rel="stylesheet" href="/assets/styles.css?v=20261030m" />
    <link rel="stylesheet" href="/assets/live.css?v=20261030m" />
    <link rel="stylesheet" href="/assets/scorecards.css?v=20261030m" />
    <link rel="stylesheet" href="/assets/sports-system.css?v=20261030m" />
    <link rel="stylesheet" href="/assets/public_match.css?v=20261030k" />
  </head>
  <body class="public-fixtures-page scorecards-page scorecard-detail-page">
    <main class="page-shell fixtures-shell">
      <div data-public-header></div>

      <a id="scBack" class="sc-back" href="/scorecards">‹ All scorecards</a>

      <!-- Same look as a scored match's page (public_match.css), README req 168 -->
      <section class="sc-wrap">
        <div class="pm-app sc-app">
          <div id="scHeader" class="pm-head">
            <p class="pm-info">Loading scorecard…</p>
          </div>
          <nav class="pm-tabbar" role="tablist" aria-label="Scorecard views">
            <button id="scTabCard" class="on is-active" type="button" role="tab" aria-selected="true" data-tab="card">Scorecard</button>
            <button id="scTabPhoto" type="button" role="tab" aria-selected="false" data-tab="photo">Original scorecard</button>
          </nav>
          <div id="scPanelCard" class="pm-body sc-panel" role="tabpanel" aria-labelledby="scTabCard"></div>
          <div id="scPanelPhoto" class="pm-body sc-panel" role="tabpanel" aria-labelledby="scTabPhoto" hidden></div>
        </div>
      </section>
    </main>
    <script src="/assets/public_header.js?v=20261030f"></script>
    <script src="/assets/scorecard.js?v=20261030k"></script>
  </body>
</html>
