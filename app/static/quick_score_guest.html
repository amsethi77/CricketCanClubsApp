<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>Score a match · CricketClubApp</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />

  <!-- Guest scoring (no sign-in). README: MD/README.md -> "Line-ups and guest matches". -->
  <body class="quick-score-page quick-score-guest" data-mode="guest">
    <main class="page-shell">
      <div data-public-header></div>
      <div id="qsApp" class="qs-app" aria-live="polite">
        <div class="qs-loading">Loading…</div>
      </div>

        <div id="qsModalBody"></div>
        <div class="qs-modal-actions">
          <button type="button" class="qs-btn ghost" data-modal-cancel>Cancel</button>
          <button type="button" class="qs-btn primary" data-modal-ok>Save</button>
        </div>
      </div>
    </div>

    <script src="/assets/public_header.js?v=20261030f"></script>
